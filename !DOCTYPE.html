<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executors Junior - Official Guild</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap');
        
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Oswald', sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
            border-bottom: 2px solid #ccff00;
        }
        h1 {
            font-size: 3em;
            color: #ccff00;
            text-shadow: 0 0 10px rgba(204, 255, 0, 0.5);
            margin: 0;
            text-transform: uppercase;
        }
        p.subtitle {
            color: #aaaaaa;
            font-size: 1.2em;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #ccff00;
            color: #000;
            font-weight: bold;
            text-transform: uppercase;
        }
        tr:hover {
            background-color: #2a2a2a;
        }
        .neon-text {
            color: #ccff00;
        }
    </style>
</head>
<body>

    <header>
        <h1>Executors Junior</h1>
        <p class="subtitle">The Next Generation of Legends</p>
    </header>

    <div class="container">
        <h2><span class="neon-text">|</span> Guild Roster (Live Stats)</h2>
        <p>මේ දත්ත කෙලින්ම අපේ Google Sheet එකෙන් Auto Update වෙනවා.</p>
        
        <!-- දත්ත වැටෙන Table එක -->
        <table>
            <thead>
                <tr>
                    <th>Name (IGN)</th>
                    <th>UID</th>
                    <th>Role</th>
                    <th>K/D Ratio</th>
                    <th>Headshot %</th>
                </tr>
            </thead>
            <tbody id="roster-body">
                <tr>
                    <td colspan="5">Loading player stats...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // 🔴 ඔයාගේ Google Sheet CSV ලින්ක් එක පහළින් තියෙන තැනට Paste කරන්න 🔴
        const csvUrl ='https://docs.google.com/spreadsheets/d/e/2PACX-1vS8_adUIsVD8scDRnyNk_9FWUO_4_4rCdnwZx6porv-fcGb7XS7-hnNq0mQUySqvJsrYCXqX33Eetmh/pub?output=csv';

        fetch(csvUrl)
            .then(response => response.text())
            .then(data => {
                const rows = data.split('\n');
                let html = '';
                
                // පළවෙනි පේළිය (Headers) අතහැරලා 1 ඉඳන් පටන් ගමු
                for(let i = 1; i < rows.length; i++) {
                    let cols = rows[i].split(',');
                    // පේළියේ දත්ත 5ක් තියෙනවද කියලා බලනවා
                    if(cols.length >= 5) {
                        html += `
                            <tr>
                                <td style="font-weight: bold;">${cols[0]}</td>
                                <td style="color: #aaa;">${cols[1]}</td>
                                <td style="color: #ccff00;">${cols[2]}</td>
                                <td>${cols[3]}</td>
                                <td>${cols[4]}</td>
                            </tr>
                        `;
                    }
                }
                document.getElementById('roster-body').innerHTML = html;
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('roster-body').innerHTML = '<tr><td colspan="5">Stats ගන්න බැරි වුණා. Link එක හරිද කියලා බලන්න.</td></tr>';
            });
    </script>
</body>
</html>
